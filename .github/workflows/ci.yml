name: Test PSWSMan
on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  release:
    types:
    - published

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  BUILD_CONFIGURATION: ${{ fromJSON('["Debug", "Release"]')[github.ref == 'refs/heads/main' || startsWith(github.event.release.tag_name, 'v')] }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Repo checkout

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Build module
      shell: pwsh
      run: ./build.ps1 -Configuration $env:BUILD_CONFIGURATION -Task Build

    - name: Capture PowerShell Module
      uses: actions/upload-artifact@v7
      with:
        name: PSModule
        path: output/*.nupkg

  sign:
    name: sign
    needs:
    - build
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      id-token: write  # Azure OIDC auth
      contents: read  # Repo checkout

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Restore Built PowerShell Module
      uses: actions/download-artifact@v8
      with:
        name: PSModule
        path: unsigned

    - name: OIDC Login to Azure
      shell: pwsh
      run: |
        $loginParams = @{
            ClientId = '${{ secrets.AZURE_CLIENT_ID }}'
            TenantId = '${{ secrets.AZURE_TENANT_ID }}'
        }
        ./tools/AzLoginOIDC.ps1 @loginParams

    - name: Sign module
      shell: pwsh
      run: ./build.ps1 -Task Sign -ModuleNupkg unsigned/*.nupkg
      env:
        AZURE_TS_NAME: ${{ secrets.AZURE_TS_NAME }}
        AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}

    - name: Capture Signed PowerShell Module
      uses: actions/upload-artifact@v7
      with:
        name: PSModuleSigned
        path: output/*.nupkg

  test:
    name: test
    needs:
    - build
    - sign
    # sign only runs for a release, test the unsigned build when it is skipped.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.sign.result)
    runs-on: ${{ matrix.info.os }}
    permissions:
      contents: read  # Repo checkout
    strategy:
      fail-fast: false
      matrix:
        info:
        - name: PS_7.4_x64_Windows
          psversion: '7.4.0'
          os: windows-latest
        - name: PS_7.4_x64_Linux
          psversion: '7.4.0'
          os: ubuntu-latest
        - name: PS_7.5_x64_Windows
          psversion: '7.5.0'
          os: windows-latest
        - name: PS_7.5_x64_Linux
          psversion: '7.5.0'
          os: ubuntu-latest
        - name: PS_7.6_x64_Windows
          psversion: '7.6.0'
          os: windows-latest
        - name: PS_7.6_x64_Linux
          psversion: '7.6.0'
          os: ubuntu-latest
        - name: PS_7.6_arm64_macOS
          psversion: '7.6.0'
          os: macos-latest
        - name: PS_7.6_x64_macOS
          psversion: '7.6.0'
          os: macos-26-intel

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Restore Built PowerShell Module
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.sign.result == 'success' && 'PSModuleSigned' || 'PSModule' }}
        path: output

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # gss-ntlmssp gives MIT krb5 NTLM for the GSSAPI provider. python-gssapi has
    # no Linux wheels, the Kerberos acceptor's build needs the krb5 headers.
    - name: Install gss-ntlmssp and the krb5 headers
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gss-ntlmssp libkrb5-dev

    - name: Setup WinRM and JEA on Windows
      if: runner.os == 'Windows'
      run: |
        powershell -NoProfile -NonInteractive -File ./tools/SetupWinCI.ps1

    - name: Run Tests
      shell: pwsh
      run: |
        $buildParams = @{
            Configuration = $env:BUILD_CONFIGURATION
            Task = 'Test'
            PowerShellVersion = '${{ matrix.info.psversion }}'
            ModuleNupkg = 'output/*.nupkg'
        }
        ./build.ps1 @buildParams
        exit $LASTEXITCODE

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Unit Test Results (${{ matrix.info.name }})
        path: ./output/TestResults/Pester.xml

    - name: Upload Coverage Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Coverage Results (${{ matrix.info.name }})
        path: ./output/TestResults/Coverage.cobertura.xml

    - name: Upload Coverage to codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./output/TestResults/Coverage.cobertura.xml
        flags: ${{ matrix.info.name }}
        token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: publish
    needs:
    - test
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write  # Needed for GitHub release asset task

    steps:
    - name: Restore Signed PowerShell Module
      uses: actions/download-artifact@v8
      with:
        name: PSModuleSigned
        path: ./

    - name: Upload to release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload \
          "${{ github.event.release.tag_name }}" \
          *.nupkg \
          --repo "${{ github.repository }}"

    - name: Publish to the PowerShell Gallery
      run: >-
        dotnet nuget push *.nupkg
        --api-key "${PSGALLERY_TOKEN}"
        --source "https://www.powershellgallery.com/api/v2/package"
        --no-symbols
      env:
        PSGALLERY_TOKEN: ${{ secrets.PSGALLERY_TOKEN }}
